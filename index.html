<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Curated by the FOK team — listen on Spotify." />
  <title>Playlist | Curated by the FOK team</title>

  <!-- Social previews -->
  <meta property="og:title" content="Kizomba Vibes | Friends of Kiz" />
  <meta property="og:description" content="Curated by the FOK team — listen on Spotify." />
  <meta property="og:type" content="website" />
  <!-- TODO: replace with your hosted image + url -->
  <meta property="og:image" content="https://github.com/pbernard-vkttt/FOK-Spotify-Host/blob/main/fok-logo.png" />
  <meta property="og:url" content="https://music.friendsofkiz.com/" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root{
      color-scheme: dark;
      --bg0:#070510;
      --bg1:#1b0f3a;
      --card:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --shadow: 0 20px 80px rgba(0,0,0,.55);
      --radius: 22px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}

body{
  margin:0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
  color:var(--text);
  background:
    radial-gradient(900px 600px at 20% 15%, rgba(170,75,255,.35), transparent 60%),
    radial-gradient(900px 600px at 80% 25%, rgba(90,0,180,.28), transparent 55%),
    radial-gradient(1200px 800px at 50% 90%, rgba(255,120,90,.10), transparent 60%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
  padding:28px 16px;

  /* NEW: full-height page layout (footer can sit at bottom) */
  min-height: 100svh;
  display:flex;
  justify-content:center;
  align-items:stretch; /* was center */
}

/* NEW: make wrap a full-height 3-row layout */
.wrap{
  width:min(980px, 100%);
  display:grid;
  gap:18px;

  /* header / content / footer */
  grid-template-rows: auto 1fr auto;

  /* stretch to fill available height */
  min-height: calc(100svh - 56px); /* subtract body padding (28*2) */
}

/* Keep your embed responsive, but allow it to grow/shrink inside the middle row */
.embed{
  width:100%;
  height: clamp(360px, 65vh, 620px);
}

/* Ensure the card can shrink gracefully if needed */
.card{
  min-height: 0;
}

/* Footer stays at bottom naturally because of grid rows */
footer{
  margin-top: 4px;
}

/* MOBILE TWEAKS */
@media (max-width: 640px){
  body{
    padding:14px 12px; /* closer to top */
  }

  .wrap{
    gap:12px;
    min-height: calc(100svh - 28px); /* subtract new mobile padding (14*2) */
  }

  header{
    flex-direction:column;
    align-items:stretch;
    gap:10px; /* tighter */
  }

  .brand{
    gap:10px; /* tighter */
    align-items:flex-start;
  }

  .logo{
    width:40px;
    height:40px;
    border-radius:12px;
  }

  .sub{
    margin-top:4px;
  }

  .actions{
    justify-content:flex-start;
  }

  .embed{
    height: 352px;
    max-height: none;
  }
}

  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-label="FOK logo">
          <img id="logoImg" src="fok-logo.png" alt="FOK">
          <span id="logoFallback" style="display:none;">FOK</span>
        </div>

        <div style="min-width:0">
          <h1 id="playlistTitle">Kizomba Vibes</h1>
          <p class="sub">Curated by the FOK team. Press play, share with a friend, and let the vibe carry.</p>
        </div>
      </div>

      <div class="actions">
        <a class="btn" id="openSpotify" href="https://open.spotify.com/playlist/46FTdlQCcfAVYjnWGNNCw2" target="_blank" rel="noopener">
          🎧 Open in Spotify
        </a>
        <button class="btn" id="copyBtn" type="button">🔗 Copy link</button>
      </div>
    </header>

    <section class="card" id="listen" aria-label="Spotify playlist embed">
      <div class="embed">
        <iframe
          title="Spotify playlist"
          src="https://open.spotify.com/embed/playlist/46FTdlQCcfAVYjnWGNNCw2?utm_source=generator&theme=0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>
    </section>

    <footer>
      <div>© <span id="year"></span> Friends of Kiz</div>
      <div>
        <a href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a>
      </div>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Link copied</div>

  <script>
    // Set current year
    document.getElementById("year").textContent = new Date().getFullYear();

    // Logo fallback (cleaner than inline onerror)
    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    logoImg.addEventListener("error", () => {
      logoImg.style.display = "none";
      logoFallback.style.display = "block";
    });

    // Optional: customize via query params
    // Example: index.html?name=Aura&playlist=46FTdlQCcfAVYjnWGNNCw2
    const params = new URLSearchParams(location.search);
    const name = params.get("name");
    const playlistId = params.get("playlist");

    if (name) document.getElementById("playlistTitle").textContent = name;

    if (playlistId) {
      const playlistUrl = `https://open.spotify.com/playlist/${playlistId}`;
      document.getElementById("openSpotify").href = playlistUrl;
      document.querySelector("iframe").src =
        `https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0`;
    }

    // Copy link button + toast
    const toast = document.getElementById("toast");
    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1200);
    }

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const url = location.href;
      try {
        await navigator.clipboard.writeText(url);
        showToast("Link copied!");
      } catch (_) {
        prompt("Copy this link:", url);
      }
    });
  </script>
</body>
</html>
