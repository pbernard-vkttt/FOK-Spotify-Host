<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Curated by the FOK team — listen on Spotify." />
  <title>Playlist | Curated by the FOK team</title>

  <style>
    :root{
      --bg0:#070510;
      --bg1:#1b0f3a;
      --card:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --shadow: 0 20px 80px rgba(0,0,0,.55);
      --radius: 22px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 15%, rgba(170,75,255,.35), transparent 60%),
        radial-gradient(900px 600px at 80% 25%, rgba(90,0,180,.28), transparent 55%),
        radial-gradient(1200px 800px at 50% 90%, rgba(255,120,90,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 16px;
    }

    .wrap{
      width:min(980px, 100%);
      display:grid;
      gap:18px;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
    }

    .brand{
      display:flex;
      gap:14px;
      align-items:center;
      min-width:0;
    }

    /* Replace with your logo image */
    .logo{
      width:46px;height:46px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.08);
      display:grid;
      place-items:center;
      flex:0 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .logo span{
      font-weight:800;
      letter-spacing:.06em;
      font-size:13px;
      opacity:.9;
    }

    h1{
      margin:0;
      font-size: clamp(22px, 3vw, 34px);
      line-height:1.1;
      letter-spacing:-.02em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sub{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.4;
      max-width: 62ch;
    }

    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      appearance:none;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 12px;
      border-radius:14px;
      text-decoration:none;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.18); }
    .btn:active{ transform: translateY(0px); }

    .card{
      border:1px solid var(--stroke);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    /* Responsive Spotify embed */
    .embed{
      width:100%;
      aspect-ratio: 16 / 9;
      min-height: 520px; /* helps on desktop */
    }
    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background: transparent;
    }

    footer{
      color:var(--muted);
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      padding: 0 4px;
    }
    footer a{ color:var(--muted); }
    footer a:hover{ color:var(--text); }

    @media (max-width: 640px){
      header{ flex-direction:column; align-items:stretch; }
      .actions{ justify-content:flex-start; }
      .embed{ min-height: 620px; aspect-ratio:auto; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <div class="brand">
        <!-- OPTION A: Use your logo image -->
        <!-- Replace "fok-logo.png" with your hosted logo path -->
        <div class="logo" aria-label="FOK logo">
          <!-- If you don't have a logo file yet, comment the img and use the span fallback -->
          <img src="fok-logo.png" alt="FOK" onerror="this.remove(); this.parentElement.innerHTML='<span>FOK</span>';">
        </div>

        <div style="min-width:0">
          <!-- Change the playlist name here -->
          <h1 id="playlistTitle">Kizomba Vibes</h1>
          <p class="sub">Curated by the FOK team. Press play, share with a friend, and let the vibe carry.</p>
        </div>
      </div>

      <div class="actions">
        <!-- Replace with your playlist URL -->
        <a class="btn" id="openSpotify" href="https://open.spotify.com/playlist/46FTdlQCcfAVYjnWGNNCw2" target="_blank" rel="noopener">
          🎧 Open in Spotify
        </a>
        <!-- <a class="btn" href="#listen">⬇️ Listen here</a> -->
      </div>
    </header>

    <section class="card" id="listen" aria-label="Spotify playlist embed">
      <div class="embed">
        <!-- Spotify embed: replace PLAYLIST_ID if needed -->
        <!-- Using your current playlist ID: 0gtPYf9681cjigt35jQ6I0 -->
        <iframe
          title="Spotify playlist"
          src="https://open.spotify.com/embed/playlist/46FTdlQCcfAVYjnWGNNCw2?utm_source=generator&theme=0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>
    </section>

    <footer>
      <div>© <span id="year"></span> Friends of Kiz</div>
      <div>
        <a href="#" id="shareLink">Share this page</a>
        &nbsp;•&nbsp;
        <a href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a>
      </div>
    </footer>
  </main>

  <script>
    // Set current year
    document.getElementById("year").textContent = new Date().getFullYear();

    // OPTIONAL: customize via query params
    // Example: index.html?name=Aura&playlist=0gtPYf9681cjigt35jQ6I0
    const params = new URLSearchParams(location.search);
    const name = params.get("name");
    const playlistId = params.get("playlist");

    if (name) document.getElementById("playlistTitle").textContent = name;

    if (playlistId) {
      const playlistUrl = `https://open.spotify.com/playlist/${playlistId}`;
      document.getElementById("openSpotify").href = playlistUrl;
      document.querySelector("iframe").src =
        `https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0`;
    }

    // Share link behavior (uses Web Share API if available)
    document.getElementById("shareLink").addEventListener("click", async (e) => {
      e.preventDefault();
      const title = document.getElementById("playlistTitle").textContent + " — curated by the FOK team";
      const url = location.href;

      if (navigator.share) {
        try {
          await navigator.share({ title, url });
        } catch (_) {}
      } else {
        try {
          await navigator.clipboard.writeText(url);
          alert("Link copied!");
        } catch (_) {
          prompt("Copy this link:", url);
        }
      }
    });
  </script>
</body>
</html>
